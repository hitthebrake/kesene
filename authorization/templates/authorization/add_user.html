{% load static %}
<!DOCTYPE html>
<html lang="en-US" dir="ltr" data-navigation-type="combo" data-navbar-horizontal-shape="default">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- ===============================================-->
    <!--    Document Title-->
    <!-- ===============================================-->
    <title>МХАЯ</title>

    <!-- ===============================================-->
    <!--    Favicons-->
    <!-- ===============================================-->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href='{% static "images/favicon-32x32.png" %}'>
    <link rel="icon" type="image/png" sizes="16x16" href='{% static "images/favicon-16x16.png" %}'>
    <link rel="shortcut icon" type="image/x-icon" href='{% static "images/favicon.svg" %}'>
    <link rel="manifest" href='{% static "images/manifest.json" %}'>
    <meta name="msapplication-TileImage" content='{% static "images/mstile-150x150.png" %}'>
    <meta name="theme-color" content="#ffffff">
    <script src='{% static "js/simplebar.min.js" %}'></script>
    <script src='{% static "js/config.js" %}'></script>


    <!-- ===============================================-->
    <!--    Stylesheets-->
    <!-- ===============================================-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap"
          rel="stylesheet">
    <link href='{% static "css/simplebar.min.css" %}' rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href='{% static "css/theme-rtl.min.css" %}' type="text/css" rel="stylesheet" id="style-rtl">
    <link href='{% static "css/theme.min.css" %}' type="text/css" rel="stylesheet" id="style-default">
    <link href='{% static "css/user-rtl.min.css" %}' type="text/css" rel="stylesheet" id="user-style-rtl">
    <link href='{% static "css/user.min.css" %}' type="text/css" rel="stylesheet" id="user-style-default">
    <script>
        let phoenixIsRTL = window.config.config.phoenixIsRTL;
        if (phoenixIsRTL) {
            let linkDefault = document.getElementById('style-default');
            let userLinkDefault = document.getElementById('user-style-default');
            linkDefault.setAttribute('disabled', true);
            userLinkDefault.setAttribute('disabled', true);
            document.querySelector('html').setAttribute('dir', 'rtl');
        } else {
            let linkRTL = document.getElementById('style-rtl');
            let userLinkRTL = document.getElementById('user-style-rtl');
            linkRTL.setAttribute('disabled', true);
            userLinkRTL.setAttribute('disabled', true);
        }
    </script>
    <link href='{% static "css/leaflet.css" %}' rel="stylesheet">
    <link href='{% static "css/MarkerCluster.css" %}' rel="stylesheet">
    <link href='{% static "css/MarkerCluster.Default.css" %}' rel="stylesheet">
</head>


<body>

<!-- ===============================================-->
<!--    Main Content-->
<!-- ===============================================-->
<main class="main" id="top">
    {% include 'core/sidebar.html' %}
    {% include 'core/navbar.html' %}
    <div class="content">
        <div class="border-bottom border-translucent mb-7 mx-n3 px-3 mx-lg-n6 px-lg-6">
            <div class="row">
                <div class="col-xl-12">
                    <div class="d-sm-flex justify-content-between">
                        <h4 class="mb-4">Добавить пользователя</h4>
                        <div class="d-flex mb-3">
                            <button class="btn btn-phoenix-secondary"><span
                                    class="fa-solid fa-cloud-arrow-up me-2"></span>Загрузить из файла
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-xl-12">
                <div class="d-flex align-items-end position-relative mb-7">
                    <input class="d-none" id="upload-avatar" type="file"/>
                    <div class="hoverbox" style="width: 150px; height: 150px">
                        <div class="hoverbox-content rounded-circle d-flex flex-center z-1"
                             style="--phoenix-bg-opacity: .56;"><span
                                class="fa-solid fa-camera fs-1 text-body-quaternary"></span></div>
                        <div class="position-relative bg-body-quaternary rounded-circle cursor-pointer d-flex flex-center mb-xxl-7">
                            <div class="avatar avatar-5xl"><img class="rounded-circle"
                                                                src='{% static "images/30.webp" %}'
                                                                alt=""/></div>
                            <label class="w-100 h-100 position-absolute z-1" for="upload-avatar"></label>
                        </div>
                    </div>
                </div>
                <h4 class="mb-3">Личная информация</h4>
                <form class="row g-3 mb-9">
                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <input class="form-control" id="floatingInputName" type="text" placeholder="Введите имя"/>
                            <label for="floatingInputCompany">Имя</label>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <input class="form-control" id="floatingInputSurname" type="text"
                                   placeholder="Ведите фамилию"/>
                            <label for="floatingInputTitle">Фамилия</label>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <input class="form-control" id="floatingInputSecond_name" type="text"
                                   placeholder="Введите отчество"/>
                            <label for="floatingInputEmail">Отчество</label>
                        </div>
                    </div>
                    <h4 class="mb-3">Место работы </h4>

                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <select class="form-select" id="floatingSelectIndustry">
                                <option selected="selected">Выберите организацию</option>
                                <option value="1">Головной офис РГП "КазРеставрация"</option>
                                <option value="2">Головной офис РГП "КазРеставрация"</option>
                                <option value="3">Головной офис РГП "КазРеставрация"</option>
                            </select>
                            <label for="floatingSelectIndustry">Организация</label>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <select class="form-select" id="floatingSelectDepartment">
                                <option selected="selected">Выерите отдел</option>
                                <option value="1">Информационный отдел</option>
                                <option value="2">Информационный отдел</option>
                                <option value="3">Информационный отдел</option>
                            </select>
                            <label for="floatingSelectStatus">Отдел </label>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="form-floating">
                            <select class="form-select" id="floatingSelectLeadStaff">
                                <option selected="selected">Выберите должность</option>
                                <option value="1">Менеджер проекта</option>
                                <option value="2">Инженер ТВР</option>
                                <option value="3">Директор</option>
                            </select>
                            <label for="floatingSelectLeadSource">Должность</label>
                        </div>
                    </div>

                    <h4 class="mt-6">Контактные данные</h4>
                    <div class="col-sm-6">
                        <div class="form-floating"><input class="form-control" type="text"
                                                          placeholder="Введите номер телефона"><label>Номер
                            телефона</label></div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-floating"><input class="form-control" type="text" placeholder="Введите E-mail"><label>E-mail</label>
                        </div>
                    </div>
                    <h4 class="mt-6">Разрешения</h4>
                    <div class="col-sm-12">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="inlineCheckbox1" type="checkbox" value="option1"/>
                            <label class="form-check-label" for="inlineCheckbox1">Администратор</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="inlineCheckbox2" type="checkbox" value="option2"/>
                            <label class="form-check-label" for="inlineCheckbox2">Просмотр</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="inlineCheckbox3" type="checkbox" value="option3"/>
                            <label class="form-check-label" for="inlineCheckbox3">Добавить пользователей</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="inlineCheckbox4" type="checkbox" value="option4"/>
                            <label class="form-check-label" for="inlineCheckbox4">Настройка датчиков</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="inlineCheckbox4" type="checkbox" value="option4"/>
                            <label class="form-check-label" for="inlineCheckbox4">Ручной ввод</label>
                        </div>
                    </div>
                    <h4 class="mt-6">Пароль</h4>
                    <div class="col-sm-6">
                        <div class="form-floating"><input class="form-control" type="text"
                                                          placeholder="Введите номер телефона"><label>Введите
                            пароль</label></div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-floating"><input class="form-control" type="text" placeholder="Введите E-mail"><label>Повторите
                            пароль</label></div>
                    </div>
                    <div class="col-12 d-flex justify-content-end mt-6">
                        <button class="btn btn-phoenix-primary me-2 px-6">Отмена</button>
                        <button class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
        <footer class="footer position-absolute">
            <div class="row g-0 justify-content-between align-items-center h-100">
                <div class="col-12 col-sm-auto text-center">
                    <p class="mb-0 mt-2 mt-sm-0 text-body">Разработка ТОО "Казреставрация"<span
                            class="d-none d-sm-inline-block"></span><span class="d-none d-sm-inline-block mx-1">|</span><br
                            class="d-sm-none"/>2025 &copy;<a class="mx-1"
                                                             href="https://www.instagram.com/qazqaitajanarty/">Instagram</a>
                    </p>
                </div>
                <div class="col-12 col-sm-auto text-center">
                    <p class="mb-0 text-body-tertiary text-opacity-85">v0.01.0</p>
                </div>
            </div>
        </footer>
    </div>

</main>
<!-- ===============================================-->
<!--    End of Main Content-->
<!-- ===============================================-->


<!-- ===============================================-->
<!--    JavaScripts-->
<!-- ===============================================-->
<script src='{% static "js/popper.min.js" %}'></script>
<script src='{% static "js/bootstrap.min.js" %}'></script>
<script src='{% static "js/anchor.min.js" %}'></script>
<script src='{% static "js/is.min.js" %}'></script>
<script src='{% static "js/all.min.js" %}'></script>
<script src='{% static "js/lodash.min.js" %}'></script>
<script src='{% static "js/list.min.js" %}'></script>
<script src='{% static "js/feather.min.js" %}'></script>
<script src='{% static "js/dayjs.min.js" %}'></script>
<script src='{% static "js/leaflet.js" %}'></script>
<script src='{% static "js/leaflet.markercluster.js" %}'></script>
<script src='{% static "js/leaflet-tilelayer-colorfilter.min.js" %}'></script>
<script src='{% static "js/phoenix.js" %}'></script>
<script src='{% static "js/echarts.min.js" %}'></script>
<script src='{% static "js/ecommerce-dashboard.js" %}'></script>

</body>

</html>
