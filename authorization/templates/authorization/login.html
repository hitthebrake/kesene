{% extends 'core/base.html' %}

{% block title %}Вход{% endblock title %}

{% block content %}
    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-12 col-xl-11 justify-content-center d-flex">
                    <div class="card w-75 text-black" style="border-radius: 25px;">
                        <div class="card-body p-md-5">
                            <div class="row justify-content-center">
                                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                                    <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Вход</p>

                                    <form class="mx-1 mx-md-4" method="post" action="{% url 'authorization:login' %}" enctype="multipart/form-data">
                                        {% csrf_token %}
                                        <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                            <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                                            <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                                <input type="email" id="email" name="email" class="form-control border-primary"/>
                                                <label class="form-label" for="email">Адрес электронной почты*</label>
                                            </div>
                                        </div>

                                        <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                            <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                                            <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                                <input type="password" id="password" name="password" class="form-control border-primary"/>
                                                <label class="form-label" for="password">Пароль</label>
                                            </div>
                                        </div>

                                        {% if messages %}
                                            {% for message in messages %}
                                                <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                                    <span style="color:red">{{ message }}</span>
                                                </div>
                                            {% endfor %}
                                        {% endif %}

                                        <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                            <button type="submit" data-mdb-button-init data-mdb-ripple-init
                                                    class="btn btn-primary btn-lg">Войти
                                            </button>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


{% endblock content %}
