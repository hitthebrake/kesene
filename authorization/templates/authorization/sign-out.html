{% load static %}
<!DOCTYPE html>
<html lang="en-US" dir="ltr" data-navigation-type="default" data-navbar-horizontal-shape="default">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- ===============================================-->
    <!--    Document Title-->
    <!-- ===============================================-->
    <title>Система мониторинга МХАЯ</title>


    <!-- ===============================================-->
    <!--    Favicons-->
    <!-- ===============================================-->
    <link rel="apple-touch-icon" sizes="180x180" href='{% static "images/apple-touch-icon.png" %}'>
    <link rel="icon" type="image/png" sizes="32x32" href='{% static "images/favicon-32x32.png" %}'>
    <link rel="icon" type="image/png" sizes="16x16" href='{% static "images/favicon-16x16.png" %}'>
    <link rel="shortcut icon" type="image/x-icon" href='{% static "images/favicon.svg" %}'>
    <link rel="manifest" href='{% static "images/manifest.json" %}'>
    <meta name="msapplication-TileImage" content="{% static 'images/mstile-150x150.png' %}">
    <meta name="theme-color" content="#ffffff">
    <script src='{% static "js/simplebar.min.js" %}'></script>
    <script src='{% static "js/config.js" %}'></script>


    <!-- ===============================================-->
    <!--    Stylesheets-->
    <!-- ===============================================-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href='{% static "css/simplebar.min.css" %}' rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href='{% static "css/theme-rtl.min.css" %}' type="text/css" rel="stylesheet" id="style-rtl">
    <link href='{% static "css/theme.min.css" %}' type="text/css" rel="stylesheet" id="style-default">
    <link href='{% static "css/user-rtl.min.css" %}' type="text/css" rel="stylesheet" id="user-style-rtl">
    <link href='{% static "css/user.min.css" %}' type="text/css" rel="stylesheet" id="user-style-default">
    <script>
      let phoenixIsRTL = window.config.config.phoenixIsRTL;
      if (phoenixIsRTL) {
        let linkDefault = document.getElementById('style-default');
        let userLinkDefault = document.getElementById('user-style-default');
        linkDefault.setAttribute('disabled', true);
        userLinkDefault.setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        let linkRTL = document.getElementById('style-rtl');
        let userLinkRTL = document.getElementById('user-style-rtl');
        linkRTL.setAttribute('disabled', true);
        userLinkRTL.setAttribute('disabled', true);
      }
    </script>
  </head>


  <body>

    <!-- ===============================================-->
    <!--    Main Content-->
    <!-- ===============================================-->
    <main class="main" id="top">
      <div class="container-fluid bg-body-tertiary dark__bg-gray-1200">
        <div class="bg-holder bg-auth-card-overlay" style="background-image:url('{% static "images/37.png" %}');">
        </div>
        <!--/.bg-holder-->

        <div class="row flex-center position-relative min-vh-100 g-0 py-5">
          <div class="col-11 col-sm-10 col-xl-8">
            <div class="card border border-translucent auth-card">
              <div class="card-body pe-md-0">
                <div class="row align-items-center gx-0 gy-7">
                  <div class="col-auto bg-body-highlight dark__bg-gray-1100 rounded-3 position-relative overflow-hidden auth-title-box">
                    <div class="bg-holder" style="background-image:url('{% static "images/38.png" %}');"></div>
                    <!--/.bg-holder-->

                    <div class="position-relative px-4 px-lg-7 pt-7 pb-7 pb-sm-5 text-center text-md-start pb-lg-7">
                      <h3 class="mb-3 text-body-emphasis fs-7">Вход в систему</h3>
                      <p class="text-body-tertiary">Система мониторинга Мавзолей Ходжи Ахмеда Ясави</p>
                      <ul class="list-unstyled mb-0 w-max-content w-md-auto">
                        <li class="d-flex align-items-center"><span class="uil uil-check-circle text-success me-2"></span><span class="text-body-tertiary fw-semibold">Онлайн</span></li>
                        <li class="d-flex align-items-center"><span class="uil uil-check-circle text-success me-2"></span><span class="text-body-tertiary fw-semibold">В режиме 24/7</span></li>
                        <li class="d-flex align-items-center"><span class="uil uil-check-circle text-success me-2"></span><span class="text-body-tertiary fw-semibold">На всех устройствах</span></li>
                      </ul>
                    </div>
                    <div class="position-relative z-n1 mb-6 d-none d-md-block text-center mt-md-15"><img class="auth-title-box-img d-dark-none" src='{% static "images/auth.png" %}' alt="" /><img class="auth-title-box-img d-light-none" src='{% static "images/auth-dark.png" %}' alt="" /></div>
                  </div>
                  <div class="col mx-auto">
                    <div class="auth-form-box">
                      <div class="text-center mb-6 mx-auto"><img class="mb-7 d-dark-none" src='{% static "images/1.png" %}' alt="phoenix" /><img class="mb-7 d-light-none" src='{% static "images/dark_1.png" %}' alt="phoenix" />
                        <div class="mb-6">
                          <h4 class="text-body-highlight">До скорой встречи!</h4>
                          <p class="text-body-tertiary">Спасибо за внимание. <br class="d-lg-none" />Вы успешно вышли  <br class="d-sm-none" />из системы.</p>
                        </div>
                        <div class="d-grid"><a class="btn btn-primary" href='{% url "authorization:login" %}'><span class="fas fa-angle-left me-2"></span>Страница входа</a></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        let navbarTopStyle = window.config.config.phoenixNavbarTopStyle;
        let navbarTop = document.querySelector('.navbar-top');
        if (navbarTopStyle === 'darker') {
          navbarTop.setAttribute('data-navbar-appearance', 'darker');
        }

        let navbarVerticalStyle = window.config.config.phoenixNavbarVerticalStyle;
        let navbarVertical = document.querySelector('.navbar-vertical');
        if (navbarVertical && navbarVerticalStyle === 'darker') {
          navbarVertical.setAttribute('data-navbar-appearance', 'darker');
        }
      </script>
      
    </main>
    <!-- ===============================================-->
    <!--    End of Main Content-->
    <!-- ===============================================-->


    


    <!-- ===============================================-->
    <!--    JavaScripts-->
    <!-- ===============================================-->
    <script src='{% static "js/popper.min.js" %}'></script>
    <script src='{% static "js/bootstrap.min.js" %}'></script>
    <script src='{% static "js/anchor.min.js" %}'></script>
    <script src='{% static "js/is.min.js" %}'></script>
    <script src='{% static "js/all.min.js" %}'></script>
    <script src='{% static "js/lodash.min.js" %}'></script>
    <script src='{% static "js/list.min.js" %}'></script>
    <script src='{% static "js/feather-icons/feather.min.js" %}'></script>
    <script src='{% static "js/dayjs.min.js" %}'></script>
    <script src='{% static "js/phoenix.js" %}'></script>

  </body>

</html>
