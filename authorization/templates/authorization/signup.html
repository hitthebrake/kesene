{% extends 'core/base.html' %}

{% block title %}Регистрация{% endblock title %}

{% block content %}
    <section class="vh-100 bg-dark gradient-custom">
        <div class="container py-5 h-100">
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-lg-9 col-xl-7">
                    <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
                        <div class="card-body p-4 p-md-5">
                            <h3 class="mb-4 pb-2 pb-md-0 mb-md-5">Добавить нового пользователя</h3>
                            <form>

                                <div class="row">
                                    <div class="col-md-6 mb-4">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="text" id="firstName"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="first_name" required/>
                                            <label class="form-label" for="firstName">Имя*</label>
                                        </div>

                                    </div>
                                    <div class="col-md-6 mb-4">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="text" id="lastName"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="last_name" required/>
                                            <label class="form-label" for="lastName">Фамилия*</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-4 pb-2">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="email" id="emailAddress"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="email"/>
                                            <label class="form-label" for="emailAddress">Электронная почта</label>
                                        </div>

                                    </div>
                                    <div class="col-md-6 mb-4 pb-2">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="tel" id="phoneNumber"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="phone" required/>
                                            <label class="form-label" for="phoneNumber">Номер телефона*</label>
                                        </div>

                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-12 mb-4 pb-2">

                                        <select class="form-select select form-control-lg border-dark-subtle w-100"
                                                name="role" required>

                                            <option selected disabled hidden></option>
                                            <option value="4">Ученый</option>
                                            <option value="2">Админ</option>
                                            <option value="3">Инженер</option>
                                            <option value="4">Пользователь</option>
                                        </select>
                                        <label class="form-label select-label">Выберите роль*</label>

                                    </div>
                                </div>


                                <div class="row">
                                    <div class="col-md-6">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="password" id="password1"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="password1" required/>
                                            <label class="form-label" for="password1">Пароль*</label>
                                        </div>

                                    </div>
                                    <div class="col-md-6">

                                        <div data-mdb-input-init class="form-outline">
                                            <input type="password" id="password2"
                                                   class="form-control form-control-lg border-dark-subtle"
                                                   name="password2" required/>
                                            <label class="form-label" for="password2">Повторите пароль*</label>
                                        </div>

                                    </div>
                                </div>


                                <div class="mt-4 pt-2">
                                    <input data-mdb-ripple-init class="btn btn-primary btn-lg" type="submit"
                                           value="Добавить"/>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        .gradient-custom {
            /* fallback for old browsers */
            background: #f093fb;

            /* Chrome 10-25, Safari 5.1-6 */
            background: -webkit-linear-gradient(to bottom right, rgba(240, 147, 251, 1), rgba(245, 87, 108, 1));

            /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            background: linear-gradient(to bottom right, rgba(240, 147, 251, 1), rgba(245, 87, 108, 1))
        }

        .card-registration .select-input.form-control[readonly]:not([disabled]) {
            font-size: 1rem;
            line-height: 2.15;
            padding-left: .75em;
            padding-right: .75em;
        }

        .card-registration .select-arrow {
            top: 13px;
        }
    </style>

{% endblock content %}

{% block scripts %}
{% endblock scripts %}
