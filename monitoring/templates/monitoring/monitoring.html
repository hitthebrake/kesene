{% extends 'core/base.html' %}
{% block title %}Мониторинг{% endblock title %}

{% block content %}
    <form method="get" action="#">
        <select id="location-select" required>
            <option disabled selected value="">Выберите место</option>
            {% for location in locations %}
                <option value="{{ location }}">{{ location }}</option>
            {% endfor %}
        </select>
        <select name="sensor" id="sensor-select" required>
            <option disabled selected value="">Выберите датчик</option>
        </select>
        <button type="submit">Показать</button>
    </form>

{% endblock content %}

{% block scripts %}
    <script>
        const locationSelect = document.getElementById('location-select');
        locationSelect.addEventListener('change', function () {
            const location = this.value;
            const sensorSelect = document.getElementById('sensor-select');
            sensorSelect.innerHTML = '<option value="">Загрузка...</option>';

            const fetchApi = `../main/get-sensors/?location=${location}`;
            fetch(fetchApi)
                .then(response => response.json())
                .then(data => {
                    sensorSelect.innerHTML = '<option disabled selected>Выберите датчик</option>'
                    data.forEach(sensor => {
                        const option = document.createElement('option');
                        option.value = sensor.id;
                        option.textContent = sensor.name;
                        sensorSelect.appendChild(option);
                    });
                });
        });

    </script>
{% endblock scripts %}
