{% extends 'core/base.html' %}

{% block title %}Лимиты{% endblock title %}

{% block stylesheet %}{% endblock stylesheet %}

{% block content %}
    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-12 col-xl-11 justify-content-center d-flex">
                    <div class="card w-75 text-black" style="border-radius: 25px;">
                        <div class="card-body p-md-5">
                            <div class="row justify-content-center">
                                <div class="col-md-10 col-lg-6 order-2 order-lg-1">

                                    <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Задать лимит</p>

                                    <form class="mx-1 mx-md-4" method="post" action="{% url 'reports:thresholds' %}" enctype="multipart/form-data">
                                        {% csrf_token %}
                                        <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                            <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                                            <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                                <select id="location-select" class="form-select" required>
                                                    <option disabled selected value="">Выберите место</option>
                                                    {% for location in locations %}
                                                        <option value="{{ location }}">{{ location }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>

                                        <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                            <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                                            <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                                <select name="sensor_id" id="sensor-select" class="form-select" required>
                                                    <option disabled selected value="">Выберите датчик</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div id="inputTypes"></div>

                                        <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                            <button type="submit" data-mdb-button-init data-mdb-ripple-init
                                                    class="btn btn-primary btn-lg">Создать лимит
                                            </button>
                                        </div>
                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock content %}

{% block scripts %}
    <script>
        const locationSelect = document.getElementById('location-select');
        locationSelect.addEventListener('change', function () {
            const location = this.value;
            const sensorSelect = document.getElementById('sensor-select');
            sensorSelect.innerHTML = '<option value="">Загрузка...</option>';

            const fetchApi = `../get-sensors/?location=${location}`;
            fetch(fetchApi)
                .then(response => response.json())
                .then(data => {
                    sensorSelect.innerHTML = '<option disabled selected>Выберите датчик</option>'
                    data.forEach(sensor => {
                        const option = document.createElement('option');
                        option.value = sensor.id;
                        option.textContent = sensor.name;
                        sensorSelect.appendChild(option);
                    });
                });
        });

        const sensorSelect = document.getElementById('sensor-select');
        sensorSelect.addEventListener('change', function () {
            const sensorId = this.value;
            const inputTypes = document.getElementById('inputTypes');
            inputTypes.innerHTML = '<p class="ms-3 d-flex justify-content-center">Загрузка<p>';

            const fetchApi = `../get-threshold-types/?sensor_id=${sensorId}`;
            fetch(fetchApi)
                .then(response => response.json())
                .then(data => {
                    inputTypes.innerHTML = '';
                    data.forEach(type => {
                        const block = `<p class='ms-4 d-flex justify-content-center mb-0'>${type.label}</p>
                                        <div class="d-flex justify-content-center flex-row align-items-center mb-4">
                                            <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline mb-0 me-3">
                                                <input type="text" id="${type.code}_1" name="${type.code}_first"
                                                       class="form-control border-primary"/>
                                                <label class="form-label d-flex justify-content-center" for="${type.code}_1">Первый предел</label>
                                            </div>
                                            <div class="form-outline mb-0 ms-3">
                                                <input type="text" id="${type.code}_2" name="${type.code}_second"
                                                       class="form-control border-primary"/>
                                                <label class="form-label d-flex justify-content-center" for="${type.code}_2">Второй предел</label>
                                            </div>
                                        </div>`;
                        inputTypes.innerHTML += block;
                    });
                });
        });

    </script>
{% endblock scripts %}
