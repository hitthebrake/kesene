<script>
    const locationSelect = document.getElementById('locationSelect');
    locationSelect.addEventListener('change', function () {
        const location = this.value;
        const sensorsCheckbox = document.getElementById('sensorsCheckbox');
        sensorsCheckbox.innerHTML = '<label>Загрузка</label>';

        const fetchApi = `/main/get-sensors/?location=${location}`;
        fetch(fetchApi)
            .then(response => response.json())
            .then(data => {
                sensorsCheckbox.innerHTML = ''
                data.forEach(sensor => {
                    const block = `<label><input type="checkbox" name="sensor_id" value="${sensor.id}"\>${sensor.name}<\label>`;
                    sensorsCheckbox.innerHTML += block;
                });
            });
    });

</script>
